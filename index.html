<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RunDeck">
<script>window.RUNDECK_PWA=true</script>
<title>RunDeck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Chakra+Petch:wght@400;600;700&family=Oxanium:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column operator console. Sticky HUD up top, panels in the middle, five-slot nav at the bottom. Skins swap tokens only. */
:root{
  --bg:#070a13; --bg2:#150f1d; --bg3:#2a1318;
  --panel:rgba(5,3,7,.58); --solid:#0e0a10; --raise:#171119;
  --line:#3a1520; --line-hi:#6a2232;
  --fg:#ebe7ef; --dim:#aaa4b6; --faint:#6c667a;
  --accent:#ff1238; --ink:#070a13; --accent2:#1fe3f0; --num:#ff4f5e;
  --warn:#f6e33b; --ok:#22f59a; --astral:#5b8cff;
  --grid:rgba(255,18,56,.05); --shade:rgba(0,0,0,.55);
  --scan:.35; --glow:1;
  --fd:"Share Tech Mono",ui-monospace,Menlo,monospace;
  --fb:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --fu:"Share Tech Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[data-skin="sodium"]{--bg:#080a0e;--bg2:#12100c;--bg3:#241a0c;--panel:rgba(8,7,4,.6);--solid:#100e0a;--raise:#1a1610;--line:#3a2c14;--line-hi:#6b4e1e;--fg:#f1ead9;--dim:#b4aa94;--faint:#706852;--accent:#ffae3d;--ink:#0b0905;--accent2:#43dbe8;--num:#ffc46e;--grid:rgba(255,174,61,.05)}
[data-skin="matrix"]{--bg:#04090c;--bg2:#06131a;--bg3:#082028;--panel:rgba(2,9,12,.6);--solid:#071116;--raise:#0c1a21;--line:#123540;--line-hi:#1e5a6a;--fg:#dff6fb;--dim:#93b8c1;--faint:#557680;--accent:#3fe3ff;--ink:#031015;--accent2:#ff6fb1;--num:#7deeff;--grid:rgba(63,227,255,.05)}
[data-skin="astral"]{--bg:#0a0710;--bg2:#140e22;--bg3:#24163a;--panel:rgba(9,6,16,.6);--solid:#120c1c;--raise:#1b1429;--line:#2f2248;--line-hi:#4f3a78;--fg:#efe9fb;--dim:#b1a6c8;--faint:#6f6488;--accent:#c39bff;--ink:#0d0817;--accent2:#ffd27a;--num:#d8bdff;--grid:rgba(195,155,255,.05)}
[data-skin="corp"]{--bg:#e7eaee;--bg2:#eef0f3;--bg3:#f7f8fa;--panel:rgba(255,255,255,.78);--solid:#ffffff;--raise:#f2f4f7;--line:#cfd5dd;--line-hi:#9aa5b3;--fg:#141a22;--dim:#4c5664;--faint:#808a97;--accent:#c8102e;--ink:#ffffff;--accent2:#0b6bcb;--num:#c8102e;--warn:#a26b00;--ok:#0d8a4f;--astral:#3d5bd6;--grid:rgba(20,26,34,.05);--shade:rgba(20,26,34,.35);color-scheme:light}
[data-font="chakra"]{--fd:"Chakra Petch",system-ui,sans-serif;--fu:"IBM Plex Mono",ui-monospace,monospace}
[data-font="oxanium"]{--fd:"Oxanium",system-ui,sans-serif;--fu:"IBM Plex Mono",ui-monospace,monospace}
[data-font="plexmono"]{--fd:"IBM Plex Mono",ui-monospace,monospace;--fb:"IBM Plex Mono",ui-monospace,monospace;--fu:"IBM Plex Mono",ui-monospace,monospace}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:linear-gradient(165deg,var(--bg3) 0%,var(--bg2) 42%,var(--bg) 100%);background-attachment:fixed;color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
[data-back="grid"] body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(165deg,var(--bg3) 0%,var(--bg2) 42%,var(--bg) 100%);background-size:28px 28px,28px 28px,auto}
[data-back="flat"] body{background-image:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--solid)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(0deg,rgba(0,0,0,calc(var(--scan)*.45)) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.vig{position:fixed;inset:0;pointer-events:none;z-index:89;background:radial-gradient(ellipse at center,transparent 55%,var(--shade) 100%)}
#rain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.32}
#fx{position:fixed;inset:0;z-index:95;pointer-events:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.g{text-shadow:0 0 calc(10px*var(--glow)) color-mix(in srgb,var(--accent) 65%,transparent)}
.g2{text-shadow:0 0 calc(10px*var(--glow)) color-mix(in srgb,var(--accent2) 60%,transparent)}

#app{position:relative;z-index:2;max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.flick #app{animation:flick 7s infinite}
@keyframes flick{0%,95%,100%{opacity:1}96%{opacity:.82}97%{opacity:.97}98%{opacity:.88}}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 14px;padding:10px max(16px,env(safe-area-inset-left,0px)) 8px;background:color-mix(in srgb,var(--solid) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand svg{width:30px;height:30px;color:var(--accent);flex:none;filter:drop-shadow(0 0 calc(6px*var(--glow)) color-mix(in srgb,var(--accent) 60%,transparent))}
.bname{font-family:var(--fd);font-size:18px;letter-spacing:.24em;line-height:1;color:var(--fg)}
.bsub{font-family:var(--fu);font-size:9.5px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin-top:3px;white-space:nowrap}
.hstats{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--fu);font-size:12px;letter-spacing:.08em;padding:4px 8px;border:1px solid var(--line-hi);background:var(--panel);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill svg{width:14px;height:14px}
.pill.lv{border-color:var(--accent);color:var(--accent)}
.pill.cr{color:var(--warn)}
.pill.st{color:var(--num)}
.pill.cold{color:var(--faint)}
.pill.btnp{cursor:pointer}
.sync{width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 6px var(--warn)}
.sync.grid{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.sync.err{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.xpw{margin-top:8px;display:flex;align-items:center;gap:10px}
.xpbar{position:relative;flex:1;height:8px;background:var(--raise);border:1px solid var(--line);overflow:hidden}
.xpfill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 55%,transparent),var(--accent));box-shadow:0 0 calc(10px*var(--glow)) var(--accent);transition:width .6s cubic-bezier(.2,.9,.2,1)}
.xpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,var(--solid) 9px 10px);opacity:.6}
.xpl{font-family:var(--fu);font-size:11px;color:var(--dim);letter-spacing:.08em;white-space:nowrap;font-variant-numeric:tabular-nums}
.combo{display:none;margin-top:8px;align-items:center;gap:8px;font-family:var(--fd);font-size:13px;letter-spacing:.18em;color:var(--warn)}
.combo.on{display:flex;animation:pop .35s}
.combo .cbar{flex:1;height:3px;background:var(--line)}
.combo .cbar i{display:block;height:100%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
.jackchip{display:none;margin-top:8px;width:100%;text-align:left;font-family:var(--fu);font-size:12px;letter-spacing:.14em;color:var(--accent2);padding:6px 10px;border:1px solid var(--accent2);background:color-mix(in srgb,var(--accent2) 8%,transparent)}
.jackchip.on{display:block}
.jackchip b{float:right;font-variant-numeric:tabular-nums}

/* Panels */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);margin-bottom:14px}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-family:var(--fu);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent2);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%)}
.ph .gl{color:var(--accent)}
.ph .jp{color:var(--faint);letter-spacing:.1em;font-size:11px}
.ph .ct{color:var(--num);font-variant-numeric:tabular-nums}
.ph .end{margin-left:auto;display:flex;align-items:center;gap:8px}
.bc{display:none;width:58px;height:12px;background:repeating-linear-gradient(90deg,var(--accent) 0 2px,transparent 2px 3px,var(--accent) 3px 4px,transparent 4px 7px,var(--accent) 7px 10px,transparent 10px 11px,var(--accent) 11px 12px,transparent 12px 15px,var(--accent) 15px 16px,transparent 16px 18px);opacity:.85}
[data-orn="barcode"] .bc{display:block}
[data-orn="brackets"] .panel::before,[data-orn="brackets"] .panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--num);pointer-events:none}
[data-orn="brackets"] .panel::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
[data-orn="brackets"] .panel::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.pb{padding:12px}
.muted{color:var(--dim)}
.faint{color:var(--faint)}
.lab{font-family:var(--fu);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--fu);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;padding:10px 14px;border:1px solid var(--line-hi);background:var(--raise);color:var(--fg);clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));transition:transform .08s,background .15s,border-color .15s;min-height:42px}
.btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--raise))}
.btn:active{transform:translateY(1px) scale(.98)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--ink);box-shadow:0 0 calc(16px*var(--glow)) color-mix(in srgb,var(--accent) 45%,transparent)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.cy{border-color:var(--accent2);color:var(--accent2);background:color-mix(in srgb,var(--accent2) 8%,var(--raise))}
.btn.dng{border-color:var(--accent);color:var(--accent)}
.btn.sm{min-height:32px;padding:6px 10px;font-size:11px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-family:var(--fu);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:7px 10px;border:1px solid var(--line);background:var(--raise);color:var(--dim)}
.seg button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--raise))}
.seg .sw{display:inline-flex;gap:2px;margin-right:6px;vertical-align:-2px}
.seg .sw i{width:9px;height:12px;display:block}

/* Priority target */
.target{padding:14px 12px 12px}
.tname{font-family:var(--fd);font-size:clamp(20px,5.4vw,28px);line-height:1.15;letter-spacing:.03em;margin:4px 0 12px;min-height:1.2em;text-wrap:balance;overflow-wrap:anywhere}
.tname.spin{color:var(--accent2)}
.tname.land{animation:land .5s}
@keyframes land{0%{transform:scale(1.08);color:var(--warn)}100%{transform:none}}
.today{display:flex;gap:3px;margin:2px 0 4px}
.today i{flex:1;height:6px;background:var(--line)}
.today i.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.tline{display:flex;justify-content:space-between;font-family:var(--fu);font-size:11px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}

/* Terminal */
.term{display:flex;align-items:center;gap:8px;padding:10px 12px;font-family:var(--fu)}
.term .pr{color:var(--accent);font-size:16px}
.term input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-family:var(--fu);font-size:16px;color:var(--fg);caret-color:var(--accent)}
.term input::placeholder{color:var(--faint)}
.tout{padding:0 12px 10px;font-family:var(--fu);font-size:12px;color:var(--dim);letter-spacing:.04em}
.tout div{white-space:pre-wrap;overflow-wrap:anywhere}
.tout .ok{color:var(--ok)}.tout .er{color:var(--accent)}
.hints{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.hints button{font-family:var(--fu);font-size:11px;padding:4px 7px;border:1px dashed var(--line-hi);color:var(--dim)}

/* Tasks */
.tasks{list-style:none;margin:0;padding:0}
.task{border-bottom:1px solid var(--line);position:relative}
.task:last-child{border-bottom:0}
.trow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:6px;padding:8px 10px 8px 4px}
.chk{width:44px;height:44px;display:grid;place-items:center}
.chk span{width:24px;height:24px;border:1.5px solid var(--accent);display:grid;place-items:center;transform:rotate(45deg);transition:background .15s,box-shadow .15s}
.chk svg{width:14px;height:14px;transform:rotate(-45deg);opacity:0;color:var(--ink)}
.chk:hover span{box-shadow:0 0 10px color-mix(in srgb,var(--accent) 60%,transparent)}
.task.done .chk span{background:var(--accent);box-shadow:0 0 calc(12px*var(--glow)) var(--accent)}
.task.done .chk svg{opacity:1}
.tb{min-width:0;text-align:left;padding:4px 0;width:100%}
.tt{font-size:15.5px;overflow-wrap:anywhere}
.task.done .tt{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--accent)}
.tm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:3px;font-family:var(--fu);font-size:11px;color:var(--faint);letter-spacing:.06em}
.pips{display:inline-flex;gap:2px}
.pips i{width:5px;height:10px;background:var(--line-hi)}
.pips i.on{background:var(--num)}
.chip{padding:1px 6px;border:1px solid var(--line);color:var(--dim)}
.chip.tg{border-color:var(--accent2);color:var(--accent2)}
.xpv{font-family:var(--fu);font-size:12px;color:var(--num);font-variant-numeric:tabular-nums;padding-right:4px}
.task.done .xpv{color:var(--faint)}
.task.just{animation:flash .9s ease-out}
.task.just .tt{animation:glt .5s steps(2)}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 35%,transparent)}100%{background:transparent}}
@keyframes glt{0%{transform:translateX(3px);color:var(--accent2)}50%{transform:translateX(-2px);color:var(--accent)}100%{transform:none}}
.ed{display:none;padding:2px 12px 14px 50px;gap:12px;flex-direction:column}
.task.open .ed{display:flex}
.task.open{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.subs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.sub{display:flex;align-items:center;gap:8px;font-size:14px}
.sub .sc{width:32px;height:32px;display:grid;place-items:center;flex:none}
.sub .sc span{width:15px;height:15px;border:1.5px solid var(--accent2)}
.sub.done .sc span{background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
.sub.done .st{color:var(--faint);text-decoration:line-through}
.sub .st{flex:1;min-width:0;overflow-wrap:anywhere}
.sub .sx{color:var(--faint);padding:6px 8px;font-family:var(--fu)}
.inp{width:100%;min-width:0;background:var(--raise);border:1px solid var(--line);padding:9px 10px;font-size:16px;color:var(--fg);outline:0;font-family:var(--fb)}
.inp:focus{border-color:var(--accent2)}
.edl{display:flex;flex-direction:column;gap:6px}
.empty{padding:16px 12px;color:var(--faint);font-family:var(--fu);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.collapse{margin-left:auto;font-family:var(--fu);font-size:11px;color:var(--dim);letter-spacing:.14em}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;font-family:var(--fu);font-size:12px;letter-spacing:.08em;color:var(--warn);border:1px dashed color-mix(in srgb,var(--warn) 50%,transparent);margin-bottom:14px;background:var(--panel)}

/* Focus */
.ring{display:grid;place-items:center;margin:8px auto 4px;position:relative;width:min(260px,70vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .clk{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-family:var(--fd);font-size:clamp(40px,12vw,58px);letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1}
.ring .sm{font-family:var(--fu);font-size:11px;letter-spacing:.24em;color:var(--dim);margin-top:6px;text-transform:uppercase}
.focusing .ring{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{filter:drop-shadow(0 0 calc(14px*var(--glow)) color-mix(in srgb,var(--accent2) 50%,transparent))}}
.pickl{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.pickl button{text-align:left;padding:10px;border:1px solid var(--line);background:var(--raise);font-size:14.5px}
.pickl button.on{border-color:var(--accent2);color:var(--accent2)}
.bigbtn{width:100%;min-height:58px;font-size:15px}

/* Loot */
.cred{font-family:var(--fd);font-size:clamp(38px,11vw,54px);color:var(--warn);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 calc(14px*var(--glow)) color-mix(in srgb,var(--warn) 50%,transparent)}
.rw{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:0}
.rw .rn{min-width:0;overflow-wrap:anywhere}
.rw .rc{font-family:var(--fu);font-size:12px;color:var(--warn)}
.shards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:12px}
.shard{padding:10px;border:1px solid var(--line);background:var(--raise);font-family:var(--fu);font-size:11.5px;min-width:0}
.shard b{display:block;font-family:var(--fb);font-weight:600;font-size:13px;margin-bottom:4px;overflow-wrap:anywhere}
.r0{--rc:var(--dim)}.r1{--rc:var(--astral)}.r2{--rc:var(--accent2)}.r3{--rc:var(--warn)}
.shard{border-color:color-mix(in srgb,var(--rc) 55%,transparent);box-shadow:inset 0 0 18px color-mix(in srgb,var(--rc) 12%,transparent)}
.shard .rr{color:var(--rc);letter-spacing:.16em;text-transform:uppercase}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line)}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--solid);padding:12px}
.kpi .v{font-family:var(--fd);font-size:28px;color:var(--num);font-variant-numeric:tabular-nums;line-height:1.1}
.chart{padding:12px;overflow-x:auto}
.chart svg{width:100%;min-width:300px;height:150px;display:block}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:12px}
.badge{padding:10px;border:1px solid var(--line);background:var(--raise);opacity:.45;min-width:0}
.badge.on{opacity:1;border-color:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 22%,transparent)}
.badge b{display:block;font-family:var(--fd);letter-spacing:.1em;font-size:13px;color:var(--fg)}
.badge span{font-size:12px;color:var(--dim)}

.shard.enc::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--rc) 10%,transparent) 0 1px,transparent 1px 3px)}
.shard .btn{align-self:flex-start;margin-top:2px}
.shard .rwl{font-family:var(--fu);font-size:11px;color:var(--warn);letter-spacing:.04em}
.shards.dimmed{border-top:1px solid var(--line);opacity:.75}
.nav button .nbadge{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center;background:var(--accent2);color:var(--ink);font-style:normal;font-size:10px;letter-spacing:0;font-weight:700;animation:pop .4s}
.lore{display:flex;flex-direction:column;gap:10px;font-family:var(--fu);font-size:13px;color:var(--dim);line-height:1.55}
.lore p{margin:0;max-width:62ch}
.buffbar{background:repeating-linear-gradient(-45deg,var(--accent2) 0 12px,color-mix(in srgb,var(--accent2) 78%,var(--bg)) 12px 24px);background-size:34px 34px}
.term-win.dec{max-width:440px}
.term-win.dec.r1{border-color:var(--astral)}.term-win.dec.r2{border-color:var(--accent2)}.term-win.dec.r3{border-color:var(--warn)}
.decwrap{padding:14px;display:flex;flex-direction:column;gap:12px;font-family:var(--fu)}
.seqrow{display:flex;gap:8px;flex-wrap:wrap}
.sq{min-width:46px;padding:8px 0;text-align:center;border:1px solid var(--line-hi);color:var(--dim);font-size:16px;letter-spacing:.08em}
.sq.cur{border-color:var(--warn);color:var(--warn);box-shadow:0 0 12px color-mix(in srgb,var(--warn) 35%,transparent);animation:pop .4s}
.sq.ok{border-color:var(--ok);color:var(--ink);background:var(--ok)}
.dtime{height:6px;background:var(--line)}
.dtime i{display:block;height:100%;background:var(--accent);box-shadow:0 0 10px var(--accent);transition:width .08s linear}
.dgrid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}
.dc{aspect-ratio:1.25;max-width:100%;border:1px solid var(--line);background:var(--raise);color:var(--fg);font-family:var(--fu);font-size:clamp(14px,4.4vw,18px);letter-spacing:.06em;transition:background .1s,border-color .1s}
.dc:hover{border-color:var(--accent2);color:var(--accent2)}
.dc:active{transform:scale(.94)}
.dc.used{background:transparent;color:var(--faint);border-style:dashed}
.dgrid.shake{animation:shake .35s}
.dhint{margin:0;font-size:11.5px;letter-spacing:.04em}
.decres{align-items:center;text-align:center}
.decres .glitch{font-size:clamp(26px,8vw,40px);margin:4px 0}
.rwbig{font-family:var(--fd);font-size:clamp(18px,5vw,24px);color:var(--warn);letter-spacing:.06em}
.loretxt{margin:0;font-size:13.5px;color:var(--dim);line-height:1.6;max-width:42ch}
[data-skin="ghost"]{--bg:#090d10;--bg2:#0e151a;--bg3:#172028;--panel:rgba(8,12,15,.62);--solid:#0d1317;--raise:#141c22;--line:#22313b;--line-hi:#3a5361;--fg:#eef8ff;--dim:#a9bdc8;--faint:#64798a;--accent:#e8f6ff;--ink:#071015;--accent2:#7cf9ff;--num:#bff6ff;--warn:#fff38a;--grid:rgba(232,246,255,.05)}
[data-skin="blood"]{--bg:#0a0405;--bg2:#150708;--bg3:#2a0b0b;--panel:rgba(12,4,5,.62);--solid:#140809;--raise:#1d0c0d;--line:#3d1414;--line-hi:#6e2020;--fg:#ffe9e4;--dim:#c9a39c;--faint:#7d5a54;--accent:#ff2a1a;--ink:#140303;--accent2:#ff9c2a;--num:#ff6a50;--warn:#ffd0c4;--grid:rgba(255,42,26,.05)}

/* Login terminal */
.gate{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.gatewin{max-width:440px}
.gatebody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.gatehead{display:flex;align-items:center;gap:12px}
.gatehead svg{width:40px;height:40px;color:var(--accent);filter:drop-shadow(0 0 10px var(--accent))}
.gatehead .bname{font-size:22px}
.gatewin .tw-boot{padding:0}
.gatetitle{font-family:var(--fd);font-size:clamp(18px,5vw,22px);letter-spacing:.12em;text-transform:uppercase;color:var(--fg)}
.gsub{margin:-6px 0 0;font-size:14px}
.auth{max-width:none;gap:12px}
.amode{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-hi)}
.amode button{padding:10px 6px;font-family:var(--fu);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.amode button.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.afield{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--raise);padding:0 10px;transition:border-color .15s}
.afield:focus-within{border-color:var(--accent2);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent2) 35%,transparent)}
.afield .ap{font-family:var(--fu);font-size:12px;color:var(--faint);letter-spacing:.06em;white-space:nowrap}
.afield input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:13px 0;font-family:var(--fu);font-size:16px;color:var(--fg);caret-color:var(--accent)}
.peek{font-family:var(--fu);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:8px 2px}
.ahint{font-family:var(--fu);font-size:11.5px;color:var(--faint);margin-top:-6px}
.auth .linkbtn{align-self:center}
.auth .msg:empty{display:none}
#cf-box:empty{display:none}
.asec{display:flex;gap:8px;align-items:flex-start;margin:2px 0 0;font-size:12px;line-height:1.5;color:var(--faint)}
.asec svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--ok)}
.asec a{color:var(--accent2)}
.gatefoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.glang button{padding:5px 8px;font-size:11px}

#netwarn{display:none;font-family:var(--mono,monospace);font-size:11px;letter-spacing:.06em;color:var(--warn,#ffb347);padding:6px 2px 2px;opacity:.85;animation:nwb 2.4s steps(2) infinite}
#netwarn.on{display:block}
@keyframes nwb{0%,92%{opacity:.85}96%{opacity:.35}}
@media(prefers-reduced-motion:reduce){#netwarn{animation:none}}

.avwrap{position:relative;flex:none}
.avmenu{position:absolute;right:0;top:100%;margin-top:6px;min-width:190px;z-index:40;background:var(--solid);border:1px solid var(--accent);box-shadow:0 10px 30px rgba(0,0,0,.55);padding:4px;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .14s,transform .14s,visibility 0s .14s;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.avmenu::before{content:'';position:absolute;left:0;right:0;top:-8px;height:8px}
@media(hover:hover){.avwrap:hover .avmenu,.avwrap:focus-within .avmenu{opacity:1;visibility:visible;transform:none;transition:opacity .14s,transform .14s}}
.avm-h{font-size:10px;letter-spacing:.08em;opacity:.6;padding:6px 8px 7px;border-bottom:1px solid color-mix(in srgb,var(--accent) 30%,transparent);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.avmenu button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:inherit;font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:8px;cursor:pointer;text-align:left}
.avmenu button svg{width:15px;height:15px;color:var(--accent)}
.avmenu button:hover,.avmenu button:focus-visible{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);outline:none}
.prof .row{flex-wrap:wrap;gap:8px}

.alinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px}
.pwform{margin-top:6px;padding-top:12px;border-top:1px dashed color-mix(in srgb,var(--accent) 35%,transparent)}

/* Plain Dark / Plain Light: calm, no terminal effects. Paired with the Plain voice for everyday wording. */
[data-skin="plain"]{--bg:#121418;--bg2:#121418;--bg3:#121418;--panel:#1a1d23;--solid:#1d2027;--raise:#242830;--line:#2c3038;--line-hi:#3d434e;--fg:#e8eaef;--dim:#a7adb8;--faint:#737a86;--accent:#6aa8ff;--ink:#0d1117;--accent2:#7fcfa8;--num:#9cc4ff;--warn:#e2b45a;--ok:#5fcf95;--astral:#a395ff;--grid:transparent;--shade:rgba(0,0,0,.5);color-scheme:dark}
[data-skin="paper"]{--bg:#f3f3f0;--bg2:#f3f3f0;--bg3:#f3f3f0;--panel:#ffffff;--solid:#ffffff;--raise:#f1f2f4;--line:#e0e2e6;--line-hi:#c3c7ce;--fg:#1c1e22;--dim:#565b65;--faint:#8a8f99;--accent:#2f6fe0;--ink:#ffffff;--accent2:#1f8a5c;--num:#2f6fe0;--warn:#9a6200;--ok:#1f8a5c;--astral:#6b4fd8;--grid:transparent;--shade:rgba(20,24,30,.28);color-scheme:light}
[data-font="plain"]{--fd:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--fb:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--fu:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
:is([data-skin="plain"],[data-skin="paper"]) body::after{display:none}
:is([data-skin="plain"],[data-skin="paper"]) :is(*,*::before,*::after){clip-path:none!important;text-shadow:none!important;text-transform:none!important;letter-spacing:normal!important}
:is([data-skin="plain"],[data-skin="paper"]) :is(.jp,.bc,.hxid,.glitch::before,.glitch::after,.task.hk .tt::before,.task.hk .tt::after){display:none!important}
:is([data-skin="plain"],[data-skin="paper"]) .flick #app,:is([data-skin="plain"],[data-skin="paper"]) .task.hk,:is([data-skin="plain"],[data-skin="paper"]) .task.hk :is(.tt,.chk span){animation:none!important}
:is([data-skin="plain"],[data-skin="paper"]) .panel{border-radius:14px;background:var(--panel);backdrop-filter:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}
:is([data-skin="plain"],[data-skin="paper"]) :is(.btn,.seg,.seg button,.cmdbar,.inp,.chip,.evbar,.toast,.term-win,.tbtn,.strip,.avmenu,.banner,.afield,.jackchip,.task){border-radius:10px}
:is([data-skin="plain"],[data-skin="paper"]) :is(.avw,.avbtn){border-radius:50%;overflow:hidden}
:is([data-skin="plain"],[data-skin="paper"]) .task.hk{border-left:3px solid var(--astral)}
:is([data-skin="plain"],[data-skin="paper"]) .bname{font-weight:700}
:is([data-skin="plain"],[data-skin="paper"]) .evbar{background:color-mix(in srgb,var(--warn) 16%,var(--solid))!important;color:var(--fg);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);animation:none!important}
:is([data-skin="plain"],[data-skin="paper"]) .evbar b{color:var(--warn)}
:is([data-skin="plain"],[data-skin="paper"]) .chk span{border-radius:50%}
:is([data-skin="plain"],[data-skin="paper"]) .cmdbar{animation:none;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.cmdbar.plainbar .cb-main{display:flex;align-items:center;gap:12px;padding:0 16px;flex:1;font-family:var(--fb);font-size:15px;color:var(--dim)}
.cmdbar.plainbar .cb-plus{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-size:20px;line-height:1}
.cmdbar.plainbar .cb-main{flex-direction:row;justify-content:flex-start}
:is([data-skin="plain"],[data-skin="paper"]) body{background-image:none!important}
:is([data-skin="plain"],[data-skin="paper"]) :is(.ph,.panel){background-image:none!important}
:is([data-skin="plain"],[data-skin="paper"]) .vig{display:none}
.cmdbar.plainbar .cb-ph{color:var(--dim)}

/* Guided tour */
.tour{position:fixed;inset:0;z-index:200;pointer-events:auto;animation:tin .2s ease-out}
.tour.out{opacity:0;transition:opacity .2s}
.tour.dim{background:color-mix(in srgb,#04050a 66%,transparent)}
@keyframes tin{from{opacity:0}}
.tour-hole{position:fixed;border:2px solid var(--accent);border-radius:10px;box-shadow:0 0 0 200vmax color-mix(in srgb,#04050a 66%,transparent),0 0 24px color-mix(in srgb,var(--accent) calc(40%*var(--glow)),transparent);transition:left .32s ease,top .32s ease,width .32s ease,height .32s ease,opacity .2s;pointer-events:none}
.tour-card{position:fixed;max-height:calc(100vh - 24px);overflow:auto;background:var(--solid);border:1px solid var(--line-hi);box-shadow:0 18px 50px rgba(0,0,0,.5);padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;animation:tcard .28s ease-out;transition:top .32s ease,left .32s ease}
@keyframes tcard{from{opacity:0;transform:translateY(8px)}}
.tour-art{background:var(--raise);border:1px solid var(--line);padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tour-art .tsv{width:100%;max-width:380px;height:auto;display:block;overflow:visible}
.tour-n{font-family:var(--fu);font-size:11px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.tour-txt h3{margin:2px 0 4px;font-family:var(--fd);font-size:19px;color:var(--fg);letter-spacing:.02em}
.tour-txt p{margin:0;font-size:14.5px;line-height:1.5;color:var(--dim)}
.tour-dots{display:flex;gap:5px;justify-content:center}
.tour-dots i{width:6px;height:6px;border-radius:3px;background:var(--line-hi);transition:width .2s}
.tour-dots i.past{background:color-mix(in srgb,var(--accent) 45%,var(--line-hi))}
.tour-dots i.on{width:18px;background:var(--accent)}
.tour-nav{display:flex;align-items:center;gap:8px}
.tour-nav .sp{flex:1}
.tlang{display:flex}
.tlang button{flex:1}
.tstyle{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tstyle button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:8px;background:var(--raise);border:1px solid var(--line);color:var(--fg);cursor:pointer;text-align:left;font:inherit}
.tstyle button svg{width:100%;height:auto;display:block;margin-bottom:4px}
.tstyle button b{font-size:13px}
.tstyle button small{font-size:11.5px;color:var(--dim);line-height:1.3}
.tstyle button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tnav{display:flex;justify-content:space-around;width:100%;padding:6px 0}
.tnav span{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);font-family:var(--fu);font-size:10px}
.tnav b{font-weight:400;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnav span.on{color:var(--accent)}
.tnav svg{width:20px;height:20px}
.tq{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12.5px;color:var(--dim);padding-bottom:6px}
.tq .helpb{width:26px;height:26px;display:inline-grid;place-items:center}
.helpb{font-family:var(--fd);font-weight:700}
.tsv text{font-family:var(--fu);font-size:11px;fill:var(--dim)}
.tsv .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre}
.tsv .fg{fill:var(--fg)}.tsv .ac{fill:var(--accent)}.tsv .a2{fill:var(--accent2)}.tsv .wn{fill:var(--warn)}.tsv .ink{fill:var(--ink)}
.tsv .lb{fill:var(--fg);font-size:10.5px;opacity:.85}.tsv .sm{font-size:10px}.tsv .sm2{font-size:11px}
.tsv .big{font-size:17px;font-weight:700;fill:var(--fg)}.tsv .big.ac{fill:var(--accent)}.tsv .big2{font-size:14px;font-weight:700}
.tsv .bx{fill:var(--solid);stroke:var(--line-hi);stroke-width:1}
.tsv .bx.hi{stroke:var(--accent);stroke-width:1.5}
.tsv .bx.care{stroke:color-mix(in srgb,var(--astral) 60%,var(--line-hi))}
.tsv .bx.wnb{stroke:var(--warn)}
.tsv .ln{stroke:var(--line-hi);stroke-width:1.5;fill:none}
.tsv .dash{stroke-dasharray:4 4}
.tsv .co{stroke:var(--faint);stroke-width:1;fill:none}
.tsv .acf{fill:var(--accent)}.tsv .a2f{fill:var(--accent2)}.tsv .wnf{fill:var(--warn)}.tsv .asf{fill:var(--astral)}
.tsv .acs{stroke:var(--accent);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tsv .wns{stroke:var(--warn);stroke-width:1.6;fill:none}
.tsv .pip{fill:var(--line)}.tsv .pipst{fill:none;stroke:var(--line);stroke-width:5}
.tsv .arc{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.tsv .ck{fill:none;stroke:var(--accent);stroke-width:1.6}.tsv .ck.on{fill:color-mix(in srgb,var(--accent) 22%,transparent)}.tsv .ck.dash{stroke-dasharray:3 3;stroke:var(--faint)}.tsv .ck.as{stroke:var(--astral)}
.tsv .ckm{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tsv .chipb{fill:none;stroke:var(--line-hi)}
.tsv .win{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:color-mix(in srgb,var(--accent) 40%,transparent);stroke-dasharray:3 3}
.tsv .blink{animation:blink 1s steps(1) infinite}
:is([data-skin="plain"],[data-skin="paper"]) :is(.tour-card,.tour-art,.tstyle button){border-radius:12px}
:is([data-skin="plain"],[data-skin="paper"]) .tour-card{box-shadow:0 18px 50px rgba(0,0,0,.25)}
@media(max-width:480px){.tour-txt p{font-size:14px}.tstyle small{display:none}}
.tour.hint .tour-hole{box-shadow:0 0 0 200vmax color-mix(in srgb,#04050a 45%,transparent),0 0 24px color-mix(in srgb,var(--accent) calc(40%*var(--glow)),transparent)}
.tour.hint.dim{background:color-mix(in srgb,#04050a 45%,transparent)}
.tmore{margin-top:8px!important;font-size:13px!important;color:var(--faint)!important}
.tsc p{margin:6px 0 0;font-size:13px;color:var(--dim);font-family:var(--fu)}
.tsc .linkbtn{font-size:12.5px}
.tsv .pl{fill:var(--solid);stroke:var(--line-hi)}.tsv .pl.on{stroke:var(--accent);fill:color-mix(in srgb,var(--accent) 14%,var(--solid))}.tsv .pl.dash{stroke-dasharray:3 3}

.seg.multi button{flex:0 1 auto}
.schelp{margin-left:auto;font-size:12px}
.schint{font-family:var(--fu);font-size:12px;color:var(--dim);padding:8px 2px 0}
.code.pform .ln{grid-template-columns:1fr}.code.pform .ln>i{display:none}
.code.pform .k{display:block;min-width:0;margin:0 0 4px;font-size:12px;color:var(--dim)}

:is([data-skin="plain"],[data-skin="paper"]) .tw-bar :is(.tw-file,.bc){display:none}

/* Guided tour. {placeholders} are filled with the current names, so the text matches whichever wording is active. */
Object.assign(DICT.en,{tourBtn:'Tour',help:'Help',helpN:'A short guided tour of how RunDeck works.',tour:{
 skip:'Skip tour',back:'Back',next:'Next',start:'Start using RunDeck',stepOf:'{a} of {b}',
 steps:{
  welcome:['Welcome to RunDeck','RunDeck turns your to-do list into a game. Finish tasks to earn XP and {cred}, level up, and spend {cred} on rewards you pick yourself. This tour takes about a minute. Choose your language first if you like.'],
  style:['Pick a style','The full experience is neon cyberpunk with sounds and hacker lingo. Plain uses calm colours and everyday names, in dark or light. You can switch any time in {cfg}.'],
  add:['Add a task','Tap this bar, type what needs doing and press Enter. That is all you need. If you want, add shortcuts while typing: !1 !2 !3 sets the size, #word adds a tag, and @t @r @c @b picks the list.'],
  boards:['Four lists','{today} is what you want done today. {routine} are things you repeat every day; they reset each morning. {contract} are bigger jobs you split into small steps. {backlog} is for someday, kept out of the way.'],
  task:['Reading a task','Tap the box on the left to finish a task. Tap the name to open it: add steps, change the size or list, or delete it. The bars show the size ({s1} +10 XP, {s2} +25, {s3} +50), # is a tag (a label just for you), and the number on the right is the XP it gives.'],
  combo:['Keep it rolling','Finish tasks within 15 minutes of each other and a combo builds up: ×1.5, ×2, up to ×3 XP. Unticking a task takes its reward back, so there is nothing to farm.'],
  hud:['Your progress','Up top: your level, your {cred} and your day streak (days in a row you finished something). The bar fills with XP until the next level.'],
  focus:['Stuck? Let it choose','“{pick}” chooses one task and makes it your {tgt}. “{jackIn}” starts a timer that pays +2 XP per minute. Even five minutes counts; starting is the hard part.'],
  care:['Little self-care tasks','Once or twice a day a small task like “drink a glass of water” shows up in your list, marked in blue. It pays like any task. Change how often, or turn it off, in {cfg}.'],
  loot:['Bonus drops','About one in four finished tasks drops a surprise. Find them under {shards} in {loot}, and open them with a quick tap-the-codes game to win {cred}, XP boosts or new colours. Three of the same kind combine into a rarer one.'],
  shop:['Your own rewards','Add rewards you actually want, like an episode of a show, and give each a price. Buy them with {cred} once you have earned them.'],
  events:['Bonus days','Weekends give 1.5× XP and 2× {cred}. On the 25th of every month it is payday: 2× {cred}. A banner at the top shows when a bonus is on.'],
  done:['You are set','Everything else lives in {cfg}: style, sounds, language and your account. Tap ? at the top to see this tour again.']},
 style:{cyber:['Cyberpunk','Neon, sound, hacker lingo'],dark:['Plain dark','Calm, everyday words'],light:['Plain light','Calm, everyday words']},
 lbl:{add:'Add',finish:'Finish',earn:'Earn',spend:'Reward',name:'name',size:'size',tag:'tag',list:'list',tapDone:'tap = done',tapOpen:'tap = open',steps:'steps',resets:'resets daily',stepsL:'split into steps',someday:'someday',todaySub:'for today',within:'within 15 min',level:'level',streak:'streak',toNext:'XP to next level',perMin:'+2 XP / min',blue:'1–2 a day',combine:'3 → 1 rarer',price:'price',buy:'Buy',payday:'payday',days:['M','T','W','T','F','S','S'],example:'Call the dentist',exTag:'admin',water:'Drink a glass of water',rewardEx:'One episode of a show',legend:'!1 !2 !3 size · #tag · @t @r @c @b list'}}});
Object.assign(DICT.pl,{tourBtn:'Przewodnik',help:'Pomoc',helpN:'Krótki przewodnik po tym, jak działa RunDeck.',tour:{
 skip:'Pomiń',back:'Wstecz',next:'Dalej',start:'Zaczynamy',stepOf:'{a} z {b}',
 steps:{
  welcome:['Witaj w RunDeck','RunDeck zamienia listę zadań w grę. Kończ zadania, zdobywaj XP i {cred}, wbijaj poziomy i wydawaj {cred} na nagrody, które sam wybierasz. Ten przewodnik zajmie około minuty. Najpierw możesz wybrać język.'],
  style:['Wybierz styl','Pełna wersja to neonowy cyberpunk z dźwiękami i hakerskim słownictwem. Prosty styl ma spokojne kolory i zwykłe nazwy, w wersji ciemnej lub jasnej. Zmienisz to w każdej chwili w zakładce {cfg}.'],
  add:['Dodaj zadanie','Dotknij tego paska, wpisz, co trzeba zrobić, i naciśnij Enter. To wszystko. Jeśli chcesz, dodaj skróty: !1 !2 !3 ustawia rozmiar, #słowo dodaje tag, a @t @r @c @b wybiera listę.'],
  boards:['Cztery listy','{today} to to, co chcesz zrobić dzisiaj. {routine} to rzeczy powtarzane codziennie; każdego ranka zaczynają od nowa. {contract} to większe sprawy podzielone na małe kroki. {backlog} to rzeczy na kiedyś, schowane z boku.'],
  task:['Jak czytać zadanie','Dotknij pola po lewej, aby zakończyć zadanie. Dotknij nazwy, aby je otworzyć: dodaj kroki, zmień rozmiar lub listę albo je usuń. Kreski pokazują rozmiar ({s1} +10 XP, {s2} +25, {s3} +50), # to tag, czyli etykieta tylko dla ciebie, a liczba po prawej to XP za zadanie.'],
  combo:['Złap rytm','Kończ zadania w odstępach do 15 minut, a rośnie combo: ×1,5, ×2, aż do ×3 XP. Odznaczenie zadania zabiera nagrodę, więc nie da się oszukiwać.'],
  hud:['Twoje postępy','Na górze: twój poziom, twoje {cred} i seria dni (ile dni z rzędu coś zrobiłeś). Pasek wypełnia się XP aż do następnego poziomu.'],
  focus:['Nie wiesz, od czego zacząć?','„{pick}” wybiera jedno zadanie i ustawia je w sekcji {tgt}. „{jackIn}” włącza minutnik, który daje +2 XP za minutę. Nawet pięć minut się liczy; najtrudniej jest zacząć.'],
  care:['Małe zadania dla ciebie','Raz lub dwa razy dziennie na liście pojawia się małe zadanie, np. „wypij szklankę wody”, oznaczone na niebiesko. Daje XP jak każde inne. Częstotliwość zmienisz lub wyłączysz w zakładce {cfg}.'],
  loot:['Bonusy','Mniej więcej co czwarte ukończone zadanie daje niespodziankę. Znajdziesz je w sekcji {shards} w zakładce {loot}. Otwórz je szybką grą w dotykanie kodów i wygraj {cred}, bonus XP albo nowe kolory. Trzy takie same łączą się w jedną rzadszą.'],

Object.assign(DICT.sv,{tourBtn:'Rundtur',help:'Hjälp',helpN:'En kort rundtur som visar hur RunDeck fungerar.',tour:{
 skip:'Hoppa över',back:'Tillbaka',next:'Nästa',start:'Kör igång',stepOf:'{a} av {b}',
 steps:{
  welcome:['Välkommen till RunDeck','RunDeck gör din att göra-lista till ett spel. Gör klart uppgifter, tjäna XP och {cred}, gå upp i nivå och lägg {cred} på belöningar du väljer själv. Rundturen tar ungefär en minut. Välj språk först om du vill.'],

  add:['Lägg till en uppgift','Tryck på fältet, skriv vad som ska göras och tryck Enter. Det är allt. Vill du kan du använda kortkommandon: !1 !2 !3 sätter storleken, #ord lägger till en tagg och @t @r @c @b väljer lista.'],
  boards:['Fyra listor','{today} är det du vill få gjort idag. {routine} är saker du gör varje dag; de nollställs varje morgon. {contract} är större saker uppdelade i små steg. {backlog} är för någon gång, undanstoppat.'],
  task:['Så läser du en uppgift','Tryck på rutan till vänster för att göra klart en uppgift. Tryck på namnet för att öppna den: lägg till steg, ändra storlek eller lista, eller ta bort den. Strecken visar storleken ({s1} +10 XP, {s2} +25, {s3} +50), # är en tagg, en etikett bara för dig, och siffran till höger är XP:n du får.'],
  combo:['Håll igång','Gör klart uppgifter inom 15 minuter från varandra så växer en combo: ×1,5, ×2, upp till ×3 XP. Bockar du ur en uppgift försvinner belöningen, så det går inte att fuska.'],
  hud:['Dina framsteg','Högst upp: din nivå, dina {cred} och din dagsserie (hur många dagar i rad du gjort klart något). Stapeln fylls med XP fram till nästa nivå.'],
  focus:['Fastnat? Låt appen välja','”{pick}” väljer en uppgift och lägger den under {tgt}. ”{jackIn}” startar en timer som ger +2 XP per minut. Även fem minuter räknas; det svåra är att börja.'],
  care:['Små egenvårdsuppgifter','En eller två gånger om dagen dyker en liten uppgift som ”drick ett glas vatten” upp i listan, markerad i blått. Den ger XP som vilken uppgift som helst. Ändra hur ofta, eller stäng av det, under {cfg}.'],
  loot:['Bonusar','Ungefär var fjärde klar uppgift ger en överraskning. Du hittar dem under {shards} i {loot}. Öppna dem med ett snabbt kodspel och vinn {cred}, XP-boost eller nya färger. Tre av samma sort slås ihop till en ovanligare.'],
  shop:['Dina egna belöningar','Lägg till belöningar du faktiskt vill ha, som ett avsnitt av en serie, och sätt ett pris på varje. Köp dem med {cred} när du har förtjänat dem.'],
  events:['Bonusdagar','Helger ger 1,5× XP och 2× {cred}. Den 25:e varje månad är det lönedag: 2× {cred}. En banner högst upp visar när en bonus är igång.'],
  done:['Klart!','Allt annat finns under {cfg}: stil, ljud, språk och ditt konto. Tryck på ? högst upp för att se rundturen igen.']},

const SCR='アカサタナハマヤラワ#$%&01<>/\\';
function scramble(root){if(S().motion==='reduced')return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const s=n.nodeValue;return s.trim()&&s.length<60&&!n.parentElement.closest('input,textarea,script,style,svg')?1:2}});
 const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
 const items=nodes.slice(0,400).map(n=>({n,f:n.nodeValue}));let fr=0;const total=14;
 const step=()=>{fr++;const p=fr/total;items.forEach(o=>{const L=o.f.length,k=Math.floor(L*p);let s=o.f.slice(0,k);for(let i=k;i<L;i++)s+=o.f[i]===' '?' ':SCR[Math.floor(Math.random()*SCR.length)];o.n.nodeValue=s});
  if(fr<total)setTimeout(step,32);else items.forEach(o=>o.n.nodeValue=o.f)};step()}

 return svgW(L.map((l,i)=>{const y=8+i*40;return'<rect x="8" y="'+y+'" width="304" height="32" rx="6" class="bx'+(i===0?' hi':'')+'"/><rect x="18" y="'+(y+10)+'" width="12" height="12" rx="3" class="'+l[1]+'"/>'+tx(40,y+20,trunc(l[0],34),'fg','',11)+(i<2?'<rect x="254" y="'+(y+6)+'" width="48" height="20" rx="5" class="acf"/>'+tx(278,y+20,t('use'),'ink','middle',11):'')}).join(''),132)}
const TS={
 welcome:{art:artLoop,extra:langPick},
 style:{extra:stylePick},
 add:{view:'board',sel:'.cmdbar',art:artAdd,extra:scPick},
 task:{view:'board',sel:'[data-tut="l-today"] .task',art:artTask},
 boards:{view:'board',sel:'[data-tut="l-today"]',art:artBoards},
 combo:{view:'board',sel:'#combo.on,[data-tut="l-today"] .task .chk',art:artCombo},
 hud:{view:'board',sel:'#hud .hrow',art:artHud},
 focus:{view:'board',sel:'[data-tut="target"]',art:artFocus},
 care:{view:'board',sel:'.task.hk',art:artCare},
 shop:{view:'loot',sel:'[data-tut="shop"]',art:artShop},
 loot:{view:'loot',sel:'#nav [data-v="loot"]',art:artLoot},
 items:{view:'loot',sel:'[data-tut="items"]',art:artItems},
 events:{view:'board',sel:'.evbar',art:artEvents},
 bounty:{view:'board',sel:'.chip.bty',art:artBounty},
 done:{view:'board',sel:'#nav',art:artNav},
 project:{sel:'[data-tut="l-contract"]',art:artProject},
 streak:{sel:'#hud .sts',art:artStreak}
};
const FIRST=['welcome','style','add','task'],FULL=['welcome','style','add','task','boards','combo','hud','focus','care','shop','loot','items','events','bounty','done'];
/* tips: shown once, the first time a feature appears */
const HINTS={lists:'boards',project:'project',combo:'combo',streak:'streak',drop:'loot',shop:'shop',focus:'focus',care:'care',bounty:'bounty',items:'items'};
var tourList=FIRST,tourMode='tour',hintKey=null,scOpen=false;
function scPick(){return'<div class="tsc"><button type="button" class="linkbtn" data-tour="sc">'+esc(t('tour.sc'))+' '+(scOpen?'▴':'▾')+'</button>'+(scOpen?'<p>'+esc(t('tour.scB'))+'</p>':'')+'</div>'}

function tourOpen(){tourOn=true;ui.open=null;
 tourRoot=document.createElement('div');tourRoot.id='tour';tourRoot.className='tour'+(tourMode==='hint'?' hint':'');document.body.appendChild(tourRoot);
 tourRoot.addEventListener('click',tourClick);
 tourKey=e=>{if(!tourOn)return;if(e.key==='Escape'){e.preventDefault();e.stopPropagation();endTour()}else if(tourMode==='tour'&&e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();tourGo(1)}else if(tourMode==='tour'&&e.key==='ArrowLeft'){e.preventDefault();e.stopPropagation();tourGo(-1)}};
 document.addEventListener('keydown',tourKey,true);
 tourMove=()=>tourPlace(false);addEventListener('resize',tourMove);addEventListener('scroll',tourMove,{passive:true})}
function startTour(full){if(tourOn)return;$('#ovl').innerHTML='';tourMode='tour';tourList=full===true||state.tutDone?FULL:FIRST;tourI=0;scOpen=false;tourOpen();tourPaint()}
function hint(k){const H=state.hints=state.hints||{};if(H[k]||state.hintsOff||!state.tutDone)return;
 const id=HINTS[k];if(!id)return;
 if(tourOn||$('#ovl').innerHTML||document.getElementById('boot')||ui.spinning){clearTimeout(hint['t'+k]);hint['t'+k]=setTimeout(()=>hint(k),2500);return}
 const st=TS[id];if(st.view&&ui.view!==st.view)return;
 H[k]=now();save();tourMode='hint';hintKey=k;tourList=[id];tourI=0;tourOpen();tourPaint()}
function tourGo(d){const n=tourI+d;if(n<0)return;if(n>=tourList.length){endTour();return}tourI=n;sfx('tap');tourPaint()}
function endTour(){if(!tourOn)return;tourOn=false;document.removeEventListener('keydown',tourKey,true);removeEventListener('resize',tourMove);removeEventListener('scroll',tourMove);
 if(tourRoot){tourRoot.classList.add('out');const r=tourRoot;setTimeout(()=>r.remove(),220)}tourRoot=null;
 if(tourMode==='hint'){tourMode='tour';return}
 state.tutDone=true;save();if(ui.view!=='board'){ui.view='board';render()}scrollTo({top:0});setTimeout(eventIntro,400)}
function tourClick(e){const b=e.target.closest('[data-tour]');if(!b)return;const a=b.dataset.tour,v=b.dataset.v;
 if(a==='next')tourGo(1);else if(a==='back')tourGo(-1);else if(a==='skip')endTour();
 else if(a==='notips'){state.hintsOff=true;save();endTour()}
 else if(a==='sc'){scOpen=!scOpen;sfx('tap');tourPaint()}
 else if(a==='lang'){if(S().lang!==v){setLang(v);setTimeout(tourPaint,80)}}
 else if(a==='style'){const i=v==='cyber'?0:PACKS.findIndex(p=>p.s.skin===(v==='dark'?'plain':'paper'));Object.assign(S(),PACKS[i].s);applySet();save();render();sfx('tap');tourPaint()}}
function tourPaint(){if(!tourOn||!tourRoot)return;const id=tourList[tourI],st=TS[id];
 if(st.view&&ui.view!==st.view){ui.view=st.view;render()}
 const sx=t('tour.steps.'+id),v=tourVars(),hintM=tourMode==='hint',last=tourI===tourList.length-1,n=tourList.length;
 const foot=hintM?'<div class="tour-nav"><button type="button" class="linkbtn" data-tour="notips">'+esc(t('tour.noTips'))+'</button><span class="sp"></span><button type="button" class="btn pri sm" data-tour="next">'+esc(t('tour.got'))+'</button></div>':
  '<div class="tour-dots" aria-hidden="true">'+tourList.map((_,i)=>'<i class="'+(i===tourI?'on':i<tourI?'past':'')+'"></i>').join('')+'</div>'+
  '<div class="tour-nav">'+(last?'':'<button type="button" class="linkbtn" data-tour="skip">'+esc(t('tour.skip'))+'</button>')+'<span class="sp"></span>'+(tourI?'<button type="button" class="btn sm" data-tour="back">'+esc(t('tour.back'))+'</button>':'')+'<button type="button" class="btn pri sm" data-tour="next">'+esc(last?t('tour.start'):t('tour.next'))+'</button></div>';
 tourRoot.innerHTML='<div class="tour-hole"></div><div class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-h">'+
  (st.art?'<div class="tour-art">'+st.art()+'</div>':'')+
  '<div class="tour-txt"><div class="tour-n">'+esc(hintM?t('tour.tip'):fill(t('tour.stepOf'),{a:tourI+1,b:n}))+'</div><h3 id="tour-h">'+esc(fill(sx[0],v))+'</h3><p>'+esc(fill(sx[1],v))+'</p>'+(!hintM&&last&&tourList===FIRST?'<p class="tmore">'+esc(t('tour.more'))+'</p>':'')+'</div>'+
  (st.extra&&!hintM?st.extra():'')+foot+'</div>';
 tourPlace(true);const nx=tourRoot.querySelector('[data-tour="next"]');if(nx)nx.focus({preventScroll:true})}
function tourTarget(){const st=TS[tourList[tourI]];if(!st||!st.sel)return null;const el=st.sel.split(',').map(q=>document.querySelector(q)).find(Boolean);if(!el)return null;const r=el.getBoundingClientRect();return r.width&&r.height?el:null}
function tourPlace(scroll){if(!tourOn||!tourRoot)return;const card=tourRoot.querySelector('.tour-card'),hole=tourRoot.querySelector('.tour-hole');if(!card)return;
 const el=tourTarget(),vw=innerWidth,vh=innerHeight,cw=Math.min(440,vw-24);card.style.width=cw+'px';
 if(el&&scroll){const inFixed=el.closest('#hud,.nav');if(!inFixed){const hud=$('#hud').getBoundingClientRect(),r=el.getBoundingClientRect(),top=Math.max(hud.bottom,0)+14;if(r.top<top||r.bottom>vh-card.offsetHeight-20)scrollBy({top:r.top-top,behavior:'instant'})}}
 const ch=card.offsetHeight;
 if(!el){tourRoot.classList.add('dim');hole.style.opacity='0';card.style.left=((vw-cw)/2)+'px';card.style.top=Math.max(12,(vh-ch)/2)+'px';return}
 tourRoot.classList.remove('dim');const r=el.getBoundingClientRect(),pad=6;
 const top=Math.max(4,r.top-pad),bottom=Math.min(vh-4,r.bottom+pad);
 Object.assign(hole.style,{opacity:'1',left:(r.left-pad)+'px',top:top+'px',width:(r.width+pad*2)+'px',height:Math.max(0,bottom-top)+'px'});
 let ct;const below=vh-bottom-12,above=top-12;
 if(below>=ch+10)ct=bottom+10;else if(above>=ch+10)ct=top-10-ch;else ct=r.top+r.height/2>vh/2?12:vh-ch-12;
 let cl=vw<640?(vw-cw)/2:Math.min(vw-cw-12,Math.max(12,r.left+r.width/2-cw/2));
 card.style.left=cl+'px';card.style.top=Math.max(12,Math.min(vh-ch-12,ct))+'px'}

})();
</script>

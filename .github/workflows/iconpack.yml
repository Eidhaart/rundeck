name: Build icon pack
on:
  push:
    paths: ['iconpack/**', '.github/workflows/iconpack.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        run: gradle -p iconpack assembleRelease --no-daemon
      - name: Rename
        run: cp iconpack/app/build/outputs/apk/release/app-release.apk RunDeck-Icons.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: iconpack-${{ github.run_number }}
          name: RunDeck Icons (build ${{ github.run_number }})
          body: Android icon pack in the RunDeck style. Download RunDeck-Icons.apk on your phone and install it, then pick it in your launcher's icon pack setting.
          files: RunDeck-Icons.apk
          make_latest: true

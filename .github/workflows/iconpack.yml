name: Build icon pack
on:
  push:
    paths: ['iconpack/**', '.github/workflows/iconpack.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            export ANDROID_HOME=$HOME/android-sdk; mkdir -p $ANDROID_HOME/cmdline-tools
            curl -sSLo tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools && mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        run: gradle -p iconpack assembleRelease --no-daemon
      - name: Rename
        run: cp iconpack/app/build/outputs/apk/release/app-release.apk RunDeck-Icons.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: iconpack-${{ github.run_number }}
          name: RunDeck Icons (build ${{ github.run_number }})
          body: Android icon pack in the RunDeck style. Download RunDeck-Icons.apk on your phone and install it, then pick it in your launcher's icon pack setting.
          files: RunDeck-Icons.apk
          make_latest: true
